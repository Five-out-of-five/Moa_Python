name: CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Dockerfile 과 같은 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # lock 파일 버전 그대로 설치하고, 프로젝트 자체는 의존성 없이 붙인다.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Ruff
        run: ruff check .

      # tests/conftest.py 가 더미 키를 넣고 Gemini 는 대역으로 바꾸므로 실제 키가 필요 없다.
      - name: Pytest
        run: pytest -q
